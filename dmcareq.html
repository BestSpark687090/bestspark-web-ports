<!doctype html>
<html lang="en">
    <meta charset="UTF-8" /><meta
        content="width=device-width,initial-scale=1"
        name="viewport"
    />
    <title>DMCA Request?</title>
    <script>
        // Theme Picker. Paste this into the <head> of each document to make sure
        // we use the user's theme!
        (function () {
            const saved = JSON.parse(
                window.localStorage.getItem("bestspark-theme"),
            );
            for (const type in saved) {
                document.documentElement.style.setProperty(
                    `--${type}`,
                    saved[type],
                );
            }
        })();
    </script>
    <style>
        @import url(https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap);
        :root {
            --background: black;
            --color: white;
            --color-2: #aa0000;
            --height: 20vh;
            --linear-gradient: linear-gradient(
                180deg,
                var(--color-2),
                var(--background)
            );
            color-scheme: dark;
        }
        * {
            line-height: 1.3em;
        }
        br {
            height: 200%;
        }
        html {
            height: 100%;
            width: 100%;
            background-color: var(--background);
            color: var(--color);
            font-family: "IBM Plex Sans", sans-serif;
            font-weight: 400;
            color-scheme: light dark;
        }
        .title-part {
            display: flex;
            font-size: 3.68709rem;
            background: var(--linear-gradient);
            color: var(--color);
            align-items: center;
            justify-content: center;
            height: var(--height);
            border-radius: 10px;
            text-align: center;
        }
        .text {
            text-align: center;
            align-items: center;
        }
        a {
            color: var(--color);
            font-weight: 700;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: auto;
            height: auto;
            margin: auto;
        }
        .text {
            font-size: 110%;
        }
    </style>

    <div class="title-part">DMCA Request</div>
    <div class="text">
        If you have a request about your game on this site, please email
        <a href="mailto:bestspark+dmca@bestspark.org"
            >bestspark+dmca@bestspark.org</a
        >
        with the subject line of "DMCA" or something along the lines of that.<br />I
        may not be able to respond instantly, but I will respond when I can.
        Thank you.
    </div>
</html>
